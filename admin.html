<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>신청자 관리 · 부천 AI 프로젝트 클럽</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://script.google.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/style.css?v=1011">
<style>
.ahead { padding: 30px 0 10px; display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.ahead h1 { font: 800 30px/1.2 var(--sans); letter-spacing: -.04em; margin: 8px 0 0; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 20px 0; }
@media (max-width: 760px) { .kpis { grid-template-columns: 1fr 1fr; } }
.kpi { padding: 18px; }
.kpi b { font: 800 34px/1 var(--display); display: block; letter-spacing: -.03em; }
.kpi span { font-size: 13px; color: var(--muted); }
.dist { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 20px; }
@media (max-width: 900px) { .dist { grid-template-columns: 1fr; } }
.dist .card { padding: 18px; }
.dist h3 { margin: 0 0 12px; font-size: 14px; }
.hb { display: grid; grid-template-columns: 110px 1fr 28px; gap: 8px; align-items: center; font-size: 13px; margin-bottom: 6px; }
.hb i { height: 10px; border-radius: 3px; background: var(--rule); position: relative; overflow: hidden; }
.hb i::after { content: ''; position: absolute; inset: 0; width: var(--w); background: var(--ink); border-radius: 3px; }
.hb i.sel::after { background: var(--signal); }
.hb span:last-child { font: 500 12px var(--mono); text-align: right; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.toolbar select { padding: 8px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); }
table.t { border-collapse: collapse; width: 100%; min-width: 1280px; font-size: 13px; }
.t th { position: sticky; top: 0; background: var(--paper); text-align: left; font: 600 11px var(--mono); color: var(--muted); padding: 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.t th .c { display: inline-block; width: 18px; height: 18px; border-radius: 50%; background: var(--ink); color: var(--paper); text-align: center; line-height: 18px; margin-right: 4px; }
.t td { padding: 12px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.t td.long { max-width: 260px; }
.t td.long div { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.t tr:hover td { background: var(--rule); }
.t tr.st-입금확인 td:first-child { box-shadow: inset 4px 0 var(--ok); }
.t tr.st-대기 td:first-child { box-shadow: inset 4px 0 #d9a514; }
.t tr.st-취소 { opacity: .5; }
.t select { padding: 5px 6px; border-radius: 6px; border: 1.5px solid var(--line); background: var(--card); font-size: 13px; }
.t .tot { font: 600 18px var(--mono); }
.t .code { font: 600 12px var(--mono); background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); padding: 3px 6px; border-radius: 4px; }
.t .memo { width: 140px; padding: 5px 7px; border-radius: 6px; border: 1.5px solid var(--line); background: var(--card); font-size: 12px; }
.t button.more { all: unset; cursor: pointer; color: var(--signal); font-size: 12px; }
.detail { position: fixed; inset: 0; z-index: 80; background: rgba(20,15,10,.45); display: none; place-items: center; padding: 16px; }
.detail.on { display: grid; }
.detail .card { width: min(720px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; padding: 28px; }
.detail dl { display: grid; grid-template-columns: 150px 1fr; gap: 8px 16px; font-size: 14px; }
.detail dt { color: var(--muted); }
.detail dd { margin: 0; white-space: pre-wrap; }
</style>
</head>
<body>
<header class="topbar"><div class="wrap"><a class="brand" href="./"><span class="brand-mark">AI</span>부천 AI 프로젝트 클럽 <small>운영 · 신청 관리</small></a><nav class="nav"><span class="demo-flag" id="demo" hidden>DEMO</span></nav></div></header>

<main class="wrap" id="gate" style="padding:80px 0;max-width:420px">
  <span class="eyebrow">Admin</span><h1 style="font-size:28px;margin:10px 0 18px">신청 관리</h1>
  <form id="kform" style="display:grid;gap:12px"><input class="input" id="key" type="password" placeholder="관리자 키" autocomplete="current-password"><button class="btn btn-dark">열기</button>
  <p class="muted" id="khint" style="font-size:13px" hidden>데모 모드 키: demo</p></form>
</main>

<main class="wrap" id="main" hidden style="padding-bottom:80px">
  <div class="ahead"><div><span class="eyebrow">Applications</span><h1>신청자 관리</h1></div>
    <div style="display:flex;gap:8px"><button class="btn btn-ghost btn-sm" id="reload">새로고침</button><button class="btn btn-dark btn-sm" id="csv">CSV 내보내기</button></div></div>
  <div class="kpis" id="kpis"></div>
  <div class="dist" id="dist"></div>
  <div class="toolbar"><select id="filter"><option value="">전체 상태</option><option>접수</option><option>입금확인</option><option>대기</option><option>취소</option></select>
    <span class="muted" style="font-size:12px;margin-left:auto">선착순 8명 · 자리는 <b>접수 + 입금확인</b> 신청 수로 세고 8명이 차면 신청이 자동 마감돼요. 결제(계좌 입금 / 현장 결제)를 확인하면 <b>입금확인</b>으로 바꾸세요(입장 코드 발급). 안 오는 신청은 <b>취소</b>로 바꾸면 자리가 다시 열려요</span></div>
  <div class="tbl-wrap"><table class="t"><thead><tr>
    <th>#</th><th>이름 · 연락</th><th>하는 일</th><th>도구 · 사용 범위 · 코딩</th><th>Q7 바꿔 볼 일</th><th>Q6 기대</th><th>Q8 출석</th><th>상태</th><th>메모</th></tr></thead><tbody id="rows"></tbody></table></div>
</main>

<div class="detail" id="detail"><div class="card" id="dcard"></div></div>

<script src="assets/config.js?v=1011"></script>
<script src="assets/app.js?v=1011"></script>
<script>
(function () {
  const C = CLUB, B = BAPC, $ = s => document.querySelector(s);
  let KEY = sessionStorage.getItem('bapc-admin') || '', APPS = [];
  if (B.demoMode) { $('#demo').hidden = false; $('#khint').hidden = false; }


  async function open() {
    const r = await B.api('adminList', { key: KEY });
    if (!r.ok) { sessionStorage.removeItem('bapc-admin'); return B.toast(r.error || '열 수 없어요', 'err'); }
    sessionStorage.setItem('bapc-admin', KEY); APPS = r.apps; $('#gate').hidden = true; $('#main').hidden = false; render();
  }
  $('#kform').addEventListener('submit', e => { e.preventDefault(); KEY = $('#key').value; open(); });
  $('#reload').onclick = open;

  function bars(title, counts, selCounts) {
    const max = Math.max(1, ...Object.values(counts));
    return `<div class="card"><h3>${title} <span class="muted" style="font-weight:500">· 회색 전체 / 초록 입금확인</span></h3>${Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([k, v]) =>
      `<div class="hb"><span>${B.esc(k)}</span><span style="display:grid;gap:2px"><i style="--w:${v / max * 100}%"></i><i class="sel" style="--w:${(selCounts[k] || 0) / max * 100}%"></i></span><span>${selCounts[k] || 0}/${v}</span></div>`).join('') || '<p class="muted">—</p>'}</div>`;
  }
  function render() {
    const sel = APPS.filter(a => a.status === '입금확인');
    $('#kpis').innerHTML = [['신청', APPS.length], ['입금확인', sel.length + ' / ' + C.seats], ['대기', APPS.filter(a => a.status === '대기').length], ['마감까지', Math.max(0, Math.ceil((new Date(C.deadline) - Date.now()) / 864e5)) + '일']]
      .map(([k, v]) => `<div class="card kpi"><b>${v}</b><span>${k}</span></div>`).join('');
    const cnt = (list, f) => list.reduce((o, a) => { [].concat(f(a)).filter(Boolean).forEach(k => o[k] = (o[k] || 0) + 1); return o; }, {});
    const role = a => a.role === '기타' ? '기타:' + a.roleOther : a.role, tools = a => (a.tools || []).filter(t => t !== '기타');
    $('#dist').innerHTML = bars('직군', cnt(APPS, role), cnt(sel, role)) + bars('주력 도구', cnt(APPS, tools), cnt(sel, tools)) + bars('사용 범위 · 코딩 경험', Object.assign(cnt(APPS, a => a.level), cnt(APPS, a => a.coding)), Object.assign(cnt(sel, a => a.level), cnt(sel, a => a.coding)));
    let list = APPS.slice(); const f = $('#filter').value; if (f) list = list.filter(a => (a.status || '접수') === f);
    list.sort((a, b) => a.at.localeCompare(b.at)); // 선착순
    $('#rows').innerHTML = list.map((a, i) => { const st = a.status || '접수';
      return `<tr class="st-${st}" data-id="${a.id}">
        <td class="mono">${i + 1}<br><button class="more" data-more>전체</button></td>
        <td><b>${B.esc(a.name)}</b><br><span class="muted">${B.esc(a.phone)}<br>${B.esc(a.email)}</span>${a.memberCode ? `<br><span class="code" title="입장 코드">${B.esc(a.memberCode)}</span>` : ''}</td>
        <td>${B.esc(role(a))}</td>
        <td>${B.esc(tools(a).concat(a.toolsOther ? [a.toolsOther] : []).join(', '))}<br><span class="chip" style="margin-top:4px">${B.esc(a.level)}</span> <span class="chip" style="margin-top:4px">${B.esc(a.coding || '')}</span></td>
        <td class="long"><div>${B.esc(a.goal)}</div></td>
        <td class="long"><div>${B.esc([].concat(a.hope || []).join(' · '))}</div></td>
        <td>${B.esc(a.attend)}${a.absent ? '<br><span class="muted">불참 ' + B.esc(a.absent) + '</span>' : ''}<br><span class="muted">${B.esc(a.pay || '')}</span></td>
        <td><select data-status>${['접수', '입금확인', '대기', '취소'].map(x => `<option ${x === st ? 'selected' : ''}>${x}</option>`).join('')}</select></td>
        <td><input class="memo" data-memo value="${B.esc(a.memo || '')}" placeholder="메모"></td></tr>`; }).join('') || '<tr><td colspan="9" style="padding:40px;text-align:center" class="muted">아직 신청이 없어요.</td></tr>';
  }
  $('#filter').onchange = render;
  $('#rows').addEventListener('change', async e => {
    const tr = e.target.closest('tr'), a = APPS.find(x => x.id === tr.dataset.id); if (!a) return;
    const p = { key: KEY, id: a.id };
    if (e.target.hasAttribute('data-status')) { a.status = e.target.value; p.status = a.status; }
    if (e.target.hasAttribute('data-memo')) { a.memo = e.target.value; p.memo = a.memo; }
    const r = await B.api('adminUpdate', p); if (!r.ok) return B.toast('저장 실패', 'err');
    if (r.memberCode && !a.memberCode) { a.memberCode = r.memberCode; B.toast(`${a.name}님 멤버 코드: ${r.memberCode}`); } else B.toast('저장');
    render();
  });
  $('#rows').addEventListener('click', e => { if (!e.target.closest('[data-more]')) return;
    const a = APPS.find(x => x.id === e.target.closest('tr').dataset.id);
    const L = { id: '접수번호', at: '접수 시각', name: '이름', phone: '연락처', email: '이메일', role: 'Q2 하는 일', roleOther: 'Q2 기타', tools: 'Q3 도구', toolsOther: 'Q3 기타', level: 'Q4 AI 사용 범위', coding: 'Q5 코딩 경험', hope: 'Q6 기대하는 것', goal: 'Q7 바꿔 보고 싶은 일', attend: 'Q8 출석', absent: 'Q8 불참일', pay: 'Q9 결제 방법', consent: 'Q10 동의', consentNext: '2기 소식 동의' };
    $('#dcard').innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">${B.esc(a.name)}</h2><button class="btn btn-ghost btn-sm" data-x>닫기</button></div><dl style="margin-top:16px">${Object.entries(L).map(([k, l]) => `<dt>${l}</dt><dd>${B.esc([].concat(a[k] || '').join(', '))}</dd>`).join('')}</dl>`;
    $('#detail').classList.add('on');
  });
  $('#detail').addEventListener('click', e => { if (e.target.id === 'detail' || e.target.closest('[data-x]')) $('#detail').classList.remove('on'); });
  $('#csv').onclick = () => {
    const cols = ['id', 'at', 'status', 'name', 'phone', 'email', 'role', 'roleOther', 'tools', 'toolsOther', 'level', 'coding', 'hope', 'goal', 'attend', 'absent', 'pay', 'consentNext', 'memo', 'memberCode'];
    const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const rows = APPS.map(a => cols.map(c => q(Array.isArray(a[c]) ? a[c].join(', ') : a[c])).join(','));
    const blob = new Blob(['﻿' + cols.join(',') + '\n' + rows.join('\n')], { type: 'text/csv' });
    const l = document.createElement('a'); l.href = URL.createObjectURL(blob); l.download = 'AI클럽1기_신청자_' + new Date().toISOString().slice(0, 10) + '.csv'; l.click();
  };
  if (KEY) open();
})();
</script>
</body>
</html>
