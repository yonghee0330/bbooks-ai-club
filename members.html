<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>함께 쓰는 공간 · 부천 AI 특공대</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f8fafc">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234e6813'/%3E%3Cpath d='M7 22l6-6 4 4 8-9' stroke='%23ffffff' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://script.google.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/style.css?v=1015">
<style>
/* 로그인 */
.gate { min-height: calc(100vh - 60px); display: grid; place-items: center; padding: 32px 0; }
.gate .card { padding: 32px; width: min(440px, 100%); }
.gate h1 { font: 800 30px/1.3 var(--sans); letter-spacing: -.04em; margin: 12px 0 8px; }
.gate form { display: grid; gap: 14px; margin-top: 22px; }
.gate .hint { font-size: 15px; color: var(--muted); margin: 6px 0 0; }
/* 라운지 */
.lounge { max-width: 760px; margin-inline: auto; padding: 28px 0 90px; }
.lhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.lhead h1 { font: 800 clamp(24px, 4vw, 32px)/1.3 var(--sans); letter-spacing: -.04em; margin: 0; }
.lhead .out { all: unset; cursor: pointer; font-size: 15px; color: var(--muted); text-decoration: underline; }
.week { background: var(--night); color: var(--night-ink); border-radius: var(--r); padding: 22px 24px; }
.week .r { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.week b.n { font: 800 34px/1 var(--sans); letter-spacing: -.04em; }
.week .dd { font-size: 14px; font-weight: 700; background: color-mix(in srgb, var(--night-ink) 14%, transparent); padding: 4px 9px; border-radius: 4px; }
.week h2 { font-size: 22px; margin: 10px 0 2px; letter-spacing: -.03em; }
.week p { margin: 0; color: var(--night-muted); font-size: 16px; }
.week .f { margin-top: 12px; color: var(--night-ink); font-size: 17px; }
.sched { margin-top: 10px; }
.sched summary { cursor: pointer; font-size: 15px; font-weight: 600; color: var(--muted); padding: 6px 0; }
.sched ol { list-style: none; margin: 8px 0 0; padding: 0; border-top: 1px solid var(--line); }
.sched li { display: grid; grid-template-columns: 34px 92px 1fr; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 16px; }
.sched li b { color: var(--signal); font-variant-numeric: tabular-nums; }
.sched li span { color: var(--muted); font-variant-numeric: tabular-nums; }
.sched li.now { background: var(--signal-soft); }
.sched li.past { opacity: .5; }
/* 글쓰기 */
.compose { padding: 18px; margin-top: 18px; display: grid; gap: 12px; }
.compose textarea { min-height: 96px; }
.kinds { display: flex; gap: 8px; flex-wrap: wrap; }
.compose .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.compose .row .input { flex: 1; min-width: 180px; }
/* 피드 */
.feedbar { display: flex; justify-content: space-between; align-items: center; margin: 26px 0 10px; }
.feedbar h2 { margin: 0; font-size: 20px; letter-spacing: -.03em; }
.feedbar button { all: unset; cursor: pointer; font-size: 15px; font-weight: 600; color: var(--signal); }
.post { padding: 18px 18px 14px; margin-bottom: 12px; }
.ph { display: flex; align-items: center; gap: 10px; }
.av { width: 38px; height: 38px; border-radius: 50%; background: var(--bg, var(--signal-soft)); color: var(--c, var(--signal)); display: grid; place-items: center; font-weight: 800; flex: none; }
.av.op { background: var(--signal); color: var(--signal-ink); }
.who { font-weight: 700; font-size: 17px; line-height: 1.3; }
.when { font-size: 14px; color: var(--muted); }
.ph .kind { margin-left: auto; }
.pt { margin: 12px 0 0; white-space: pre-wrap; word-break: break-word; font-size: 18px; line-height: 1.65; }
.pt a, .ct a { color: var(--signal); text-decoration: underline; word-break: break-all; }
.plink { display: inline-block; margin-top: 10px; font-size: 15px; font-weight: 600; color: var(--signal); text-decoration: none; border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; word-break: break-all; }
.del { all: unset; cursor: pointer; font-size: 13px; color: var(--muted); margin-left: 8px; text-decoration: underline; }
.cm { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; display: grid; gap: 2px; }
.c { padding: 8px 0; font-size: 16px; line-height: 1.55; }
.c .cw { font-weight: 700; margin-right: 6px; }
.c .ct { white-space: pre-wrap; word-break: break-word; }
.c .cwhen { font-size: 13px; color: var(--muted); margin-left: 6px; }
.cform { display: flex; gap: 8px; margin-top: 6px; }
.cform input { flex: 1; min-width: 0; padding: 10px 12px; font-size: 16px; }
/* 탭 · 필터 */
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 22px; background: var(--line); padding: 4px; border-radius: 10px; }
.tab { all: unset; cursor: pointer; text-align: center; padding: 11px 6px; border-radius: 7px; font-weight: 700; font-size: 16px; color: var(--muted); }
.tab small { font-weight: 600; opacity: .8; margin-left: 3px; }
.tab[aria-selected="true"] { background: #fff; color: var(--signal); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.thint { margin: 14px 2px 0; font-size: 16px; color: var(--ink-2); }
.compose label.l { font-size: 14px; font-weight: 700; color: var(--muted); display: block; margin-bottom: 4px; }
.compose textarea.s { min-height: 64px; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 12px; align-items: center; }
.fb { all: unset; cursor: pointer; font-size: 14px; font-weight: 600; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2); background: #fff; }
.fb[aria-pressed="true"] { background: var(--signal); border-color: var(--signal); color: var(--signal-ink); }
.filters select { max-width: 100%; font-size: 15px; padding: 8px 10px; }
.ptitle { margin: 12px 0 0; font-size: 19px; font-weight: 800; letter-spacing: -.02em; line-height: 1.4; }
.ptitle + .pt { margin-top: 6px; }
.lg { margin-top: 10px; }
.lg b { display: block; font-size: 13px; color: var(--signal); letter-spacing: .02em; margin-bottom: 2px; }
.lg p { margin: 0; white-space: pre-wrap; word-break: break-word; font-size: 17px; line-height: 1.6; }
.pn { font-variant-numeric: tabular-nums; }
.hide { display: none !important; }
.mc { margin: 0 0 14px; }
.mc > button { all: unset; cursor: pointer; font-size: 15px; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 8px; }
.mc .dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--c, #ccd); background: var(--bg, #fff); display: inline-block; }
.cpanel { margin-top: 10px; padding: 14px; border: 1px solid var(--line); border-radius: var(--r); background: #fff; }
.cpanel p { margin: 0 0 10px; font-size: 15px; color: var(--ink-2); }
.sw { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.sw button { all: unset; cursor: pointer; height: 44px; border-radius: 10px; background: var(--bg); border: 2px solid transparent; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: var(--c); }
.sw button[aria-pressed="true"] { border-color: var(--c); }
.sw button:disabled { cursor: not-allowed; opacity: .4; }
.post.m { border-left: 5px solid var(--c, var(--line)); }
.pend { opacity: .6; }
.empty { padding: 36px 20px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r); font-size: 17px; }
@media (max-width: 520px) { .sched li { grid-template-columns: 30px 78px 1fr; } .lounge { padding-top: 20px; } }
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="./"><span class="brand-mark">AI</span>부천 AI 특공대 <small>함께 쓰는 공간</small></a>
    <nav class="nav"><a href="./">모집 안내</a><span class="demo-flag" id="demo" hidden>DEMO</span></nav>
  </div>
</header>

<!-- LOGIN -->
<main id="gate" class="wrap gate" hidden>
  <div class="card">
    <span class="eyebrow">Members only</span>
    <h1>함께 쓰는 공간</h1>
    <p style="margin:0;color:var(--ink-2);font-size:17px">1기 멤버끼리 새로 알게 된 것, 진행 현황, 질문을 올리고 댓글로 이야기하는 곳이에요. 입장 코드는 신청이 완료되면 문자로 보내드려요.</p>
    <form id="login">
      <div class="field"><label for="ln">이름</label><input class="input" id="ln" autocomplete="name" required></div>
      <div class="field"><label for="lc">입장 코드</label><input class="input" id="lc" autocomplete="off" required></div>
      <button class="btn btn-primary" type="submit">들어가기 →</button>
      <p class="hint" id="demo-hint" hidden>시험 모드: 이름 <b>Hose</b> · 코드 <b>demo</b></p>
    </form>
  </div>
</main>

<!-- LOUNGE -->
<main id="lounge" class="wrap lounge" hidden>
  <div class="lhead"><h1 id="hello"></h1><button class="out" id="logout">나가기</button></div>

  <div class="mc" id="mc"></div>

  <section class="week" id="week" aria-label="이번 회차"></section>
  <details class="sched"><summary>10회 일정 보기</summary><ol id="sched"></ol></details>

  <div class="tabs" id="tabs" role="tablist"></div>
  <p class="thint" id="thint"></p>

  <form class="card compose" id="compose">
    <!-- 정보 공유 -->
    <div data-k="정보 공유" class="kinds" role="radiogroup" aria-label="자료 종류" id="typepills"></div>
    <input data-k="정보 공유" class="input" name="title" maxlength="60" placeholder="자료 이름 (선택)">
    <!-- 진행현황 -->
    <div data-k="진행현황" class="field"><label class="l" for="proj">프로젝트</label>
      <select class="input" id="proj" name="proj"></select>
      <input class="input hide" id="newproj" name="newproj" maxlength="40" placeholder="새 프로젝트 이름 (예: 가게 인스타 자동화)" style="margin-top:8px"></div>
    <div data-k="진행현황"><label class="l" for="tried">오늘 시도한 것</label><textarea class="input s" id="tried" name="tried" maxlength="1000" placeholder="무엇을 해 봤나요?"></textarea></div>
    <div data-k="진행현황"><label class="l" for="result">결과물</label><textarea class="input s" id="result" name="result" maxlength="1000" placeholder="나온 결과, 달라진 점 (링크는 아래에)"></textarea></div>
    <div data-k="진행현황"><label class="l" for="learned">깨달은 것</label><textarea class="input s" id="learned" name="learned" maxlength="1000" placeholder="알게 된 점, 다음에 해 볼 것"></textarea></div>
    <!-- 질문 -->
    <div data-k="질문" class="kinds" role="radiogroup" aria-label="질문 분류" id="catpills"></div>
    <input data-k="질문" class="input" name="qtitle" maxlength="80" placeholder="질문 제목">
    <!-- 공통 -->
    <textarea data-k="정보 공유" class="input" name="text" id="t-info" maxlength="3000" placeholder="한마디 코멘트 · 프롬프트라면 프롬프트를 그대로 붙여 주세요"></textarea>
    <textarea data-k="질문" class="input" name="qtext" id="t-q" maxlength="1500" placeholder="어떤 상황에서, 무엇이 궁금한가요?"></textarea>
    <div class="row">
      <input class="input" name="link" type="url" placeholder="관련 링크 (선택)" id="linkin">
      <button class="btn btn-primary" type="submit" id="post-btn">올리기</button>
    </div>
  </form>

  <div class="feedbar"><h2 id="fh">함께 올린 글 <span id="sync" class="muted" style="font-size:14px;font-weight:500"></span></h2><button type="button" id="refresh">새로고침</button></div>
  <div class="filters" id="filters"></div>
  <div id="feed"></div>
</main>

<script src="assets/config.js?v=1015"></script>
<script src="assets/app.js?v=1015"></script>
<script>
/* 빠르게 쓰는 방법: ① 저장해 둔 글을 먼저 보여 주고 서버는 뒤에서 확인 ② 글·댓글은 서버 응답을 기다리지 않고 바로 화면에 올린다 */
(function () {
  const C = CLUB, B = BAPC, $ = s => document.querySelector(s);
  let S = { code: null, me: null, members: {}, posts: [], comments: [], sig: '', last: 0, busy: 0 };
  if (B.demoMode) { $('#demo').hidden = false; $('#demo-hint').hidden = false; }

  /* ---------- 저장해 둔 데이터 ---------- */
  const saveCache = () => B.store.set('lounge', { me: S.me, members: S.members, posts: S.posts.filter(p => !p.pending), comments: S.comments.filter(c => !c.pending) });
  function apply(r) { // 서버 응답을 반영하되, 아직 올라가는 중인 내 글·댓글은 지키지 않고 그대로 둔다
    const pp = S.posts.filter(p => p.pending), pc = S.comments.filter(c => c.pending);
    S.me = r.me; S.members = Object.fromEntries(r.members.map(m => [m.id, m]));
    S.posts = r.posts.concat(pp).sort((a, b) => b.at.localeCompare(a.at)); S.comments = r.comments.concat(pc).sort((a, b) => a.at.localeCompare(b.at));
    S.last = Date.now(); saveCache();
  }

  /* ---------- 입장 ---------- */
  async function boot() {
    const sess = B.store.get('session'), cache = B.store.get('lounge');
    if (sess && sess.code) {
      S.code = sess.code;
      if (cache && cache.me) { S.me = cache.me; S.members = cache.members || {}; S.posts = cache.posts || []; S.comments = cache.comments || []; enter(); sync(); return; }
      enter(true); const ok = await sync(); if (!ok && !S.me) return toGate(); return;
    }
    toGate();
  }
  function toGate() { B.store.set('session', null); B.store.set('lounge', null); $('#lounge').hidden = true; $('#gate').hidden = false; }
  $('#login').addEventListener('submit', async e => {
    e.preventDefault(); const btn = e.target.querySelector('button'); btn.disabled = true; btn.textContent = '들어가는 중…';
    const name = $('#ln').value.trim(), code = $('#lc').value.trim();
    try {
      const r = await B.api('feed', { name, code });
      if (!r.ok) { B.toast(r.error || '입장할 수 없어요', 'err'); return; }
      S.code = code; B.store.set('session', { code }); apply(r); enter();
    } catch (err) { B.toast('연결이 느려요. 잠시 후 다시 시도해 주세요', 'err'); }
    finally { btn.disabled = false; btn.textContent = '들어가기 →'; }
  });
  $('#logout').onclick = () => { B.store.set('session', null); B.store.set('lounge', null); location.reload(); };

  function enter(loading) {
    $('#gate').hidden = true; $('#lounge').hidden = false;
    $('#hello').textContent = S.me ? S.me.name + '님, 안녕하세요' : '불러오는 중…';
    renderWeek();
    if (loading) $('#feed').innerHTML = '<div class="empty">불러오는 중…</div>'; else renderFeed(true);
  }
  // 서버와 맞추기 (백그라운드). 실패해도 화면은 그대로 둔다
  let syncing = null;
  function sync() {
    if (syncing) return syncing;
    $('#sync').textContent = '새 글 확인 중…';
    syncing = (async () => {
      try {
        const r = await B.api('feed', { code: S.code });
        if (!r.ok) { if (r.error === 'auth') toGate(); return false; }
        apply(r); $('#hello').textContent = S.me.name + '님, 안녕하세요'; renderFeed(false); return true;
      } catch (e) { return false; }
      finally { $('#sync').textContent = ''; syncing = null; }
    })();
    return syncing;
  }

  /* ---------- 이번 회차 + 일정 ---------- */
  function renderWeek() {
    const { next } = B.currentSession(), s = next || C.sessions[C.sessions.length - 1];
    const days = Math.ceil((new Date(s.date + 'T14:00:00+09:00') - B.today()) / 864e5);
    $('#week').innerHTML = `<div class="r"><b class="n">${String(s.n).padStart(2, '0')}<span style="font-size:18px;opacity:.6">/${C.sessions.length}</span></b><span class="dd">${next ? (days > 0 ? 'D-' + days : days === 0 ? '오늘' : '진행 중') : '1기 종료'}</span></div>
      <h2>${B.esc(s.title)}</h2><p>${B.fmtDate(s.date, { year: 'numeric' })} 14:00–${s.end || '15:30'} · 비북스</p><div class="f">${B.esc(s.focus)}</div>
      ${s.doc ? `<p style="margin-top:10px"><a href="${B.esc(s.doc)}" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">자료 보기</a></p>` : ''}`;
    $('#sched').innerHTML = C.sessions.map(x => `<li class="${next && x.n === next.n ? 'now' : next && x.n < next.n ? 'past' : ''}"><b>${String(x.n).padStart(2, '0')}</b><span>${B.fmtDate(x.date)}</span><div>${B.esc(x.title)}</div></li>`).join('');
  }

  /* ---------- 글 · 댓글 화면 ---------- */
  const ago = iso => {
    const t = new Date(iso), sec = (Date.now() - t) / 1000;
    if (sec < 60) return '방금'; if (sec < 3600) return Math.floor(sec / 60) + '분 전'; if (sec < 86400) return Math.floor(sec / 3600) + '시간 전';
    return (t.getMonth() + 1) + '/' + t.getDate() + ' ' + String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0');
  };
  const linkify = t => B.esc(t).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener nofollow">$1</a>');
  const nameOf = id => (S.members[id] || (S.me && S.me.id === id ? S.me : {})).name || '멤버';
  const isOp = id => ((S.members[id] || (S.me && S.me.id === id ? S.me : {})).role) === '운영자';
  const mine = id => id === S.me.id || S.me.role === '운영자';
  const avatar = id => `<span class="av${isOp(id) && !colorOf(id) ? ' op' : ''}" style="${colorOf(id)}">${B.esc(nameOf(id).slice(0, 1))}</span>`;

  const PAL = [['살구', '#f7dccb', '#b8683f'], ['장미', '#f4d0d8', '#b8506a'], ['라일락', '#e3d8f2', '#7752ad'], ['하늘', '#d3e3f6', '#3f73b0'], ['민트', '#cfeade', '#2f8a68'], ['라임', '#e3ecc4', '#738a1f'], ['레몬', '#f6edbd', '#9a8512'], ['청록', '#c9e6e8', '#2f8890'], ['슬레이트', '#dadfe8', '#5a6a85'], ['모카', '#e7d9ce', '#80604b']];
  const colorOf = id => { const m = S.members[id] || (S.me && S.me.id === id ? S.me : {}), c = PAL[m.color === undefined || m.color === '' ? -1 : +m.color]; return c ? `--bg:${c[1]};--c:${c[2]}` : ''; };
  function renderColor() {
    const my = S.me.color === '' || S.me.color === undefined ? null : PAL[+S.me.color], open = S.cpOpen || !my;
    const taken = {}; Object.values(S.members).forEach(m => { if (m.id !== S.me.id && m.color !== '' && m.color !== undefined) taken[m.color] = m.name; });
    $('#mc').innerHTML = `<button type="button" id="cpbtn"><span class="dot" style="${my ? `--bg:${my[1]};--c:${my[2]}` : ''}"></span>${my ? '내 색 · ' + my[0] + ' (바꾸기)' : '내 색을 골라 주세요'}</button>` + (open ? `<div class="cpanel"><p>${my ? '다른 멤버와 겹치지 않는 색만 고를 수 있어요.' : '내 글과 댓글에 쓰일 색이에요. 한 번 고르면 언제든 바꿀 수 있어요.'}</p><div class="sw">${PAL.map((c, i) => `<button type="button" data-c="${i}" style="--bg:${c[1]};--c:${c[2]}" aria-pressed="${String(S.me.color) === String(i)}" ${taken[i] ? 'disabled title="' + B.esc(taken[i]) + '님이 쓰는 중"' : ''}>${taken[i] ? B.esc(taken[i].slice(0, 2)) : c[0]}</button>`).join('')}</div></div>` : '');
  }
  $('#mc').addEventListener('click', async e => {
    if (e.target.closest('#cpbtn')) { S.cpOpen = !S.cpOpen; return renderColor(); }
    const b = e.target.closest('[data-c]'); if (!b || b.disabled) return; const c = b.dataset.c, prev = S.me.color;
    S.me.color = c; if (S.members[S.me.id]) S.members[S.me.id].color = c; S.cpOpen = false; saveCache(); renderColor(); renderFeed(true); S.busy++;
    try { const r = await B.api('setColor', { code: S.code, color: c }); if (!r.ok) throw new Error(r.error || '저장하지 못했어요'); }
    catch (err) { S.me.color = prev; if (S.members[S.me.id]) S.members[S.me.id].color = prev; saveCache(); renderColor(); renderFeed(true); B.toast(err.message, 'err'); sync(); } finally { S.busy--; }
  });
  const KINDS = [['정보 공유', '정보 공유', '발견한 자료·링크·프롬프트를 짧은 코멘트와 함께 모아 두는 곳이에요.'], ['진행현황', '진행현황', '프로젝트마다 번호를 붙여 일지처럼 쌓아요. 프로젝트는 여러 개 만들 수 있어요.'], ['질문', '질문', '분류를 고르고 질문하면, 답변은 아래에 타래로 이어져요.']];
  const TYPES = ['프롬프트', '도구·서비스', '글·영상', '기타'], CATS = ['AI 기초', '프롬프트', '코딩·바이브코딩', '도구·설정', '업무·일상 적용', '기타'];
  S.tab = B.store.get('tab') || '정보 공유'; S.f = { '정보 공유': '전체', '진행현황': '전체', '질문': '전체' }; S.type = TYPES[0]; S.cat = CATS[0];
  const pkey = p => p.by + '|' + p.pno, logs = () => S.posts.filter(p => p.kind === '진행현황' && p.project);
  const projects = () => { const m = {}; logs().forEach(p => { const k = pkey(p); (m[k] = m[k] || { key: k, by: p.by, pno: +p.pno, name: p.project, n: 0 }).n++; }); return Object.values(m).sort((a, b) => a.by.localeCompare(b.by) || a.pno - b.pno); };
  const pills = (el, list, cur, name) => { el.innerHTML = list.map(x => `<label class="opt-pill"><input type="radio" name="${name}" value="${B.esc(x)}"${x === cur ? ' checked' : ''}><span>${B.esc(x)}</span></label>`).join(''); };

  function renderTabs() {
    const cnt = k => S.posts.filter(p => (p.kind || '정보 공유') === k).length;
    $('#tabs').innerHTML = KINDS.map(([k, n]) => `<button type="button" class="tab" role="tab" data-tab="${B.esc(k)}" aria-selected="${k === S.tab}">${n}<small>${cnt(k)}</small></button>`).join('');
    $('#thint').textContent = KINDS.find(x => x[0] === S.tab)[2];
    document.querySelectorAll('#compose [data-k]').forEach(el => el.classList.toggle('hide', el.dataset.k !== S.tab));
    $('#fh').firstChild.textContent = { '정보 공유': '모아 둔 자료 ', '진행현황': '진행 일지 ', '질문': '질문과 답변 ' }[S.tab];
  }
  function renderProj() { // 내 프로젝트 목록(선택 유지) + 새 프로젝트
    const sel = $('#proj'), cur = sel.value, mineP = projects().filter(x => x.by === S.me.id);
    sel.innerHTML = mineP.map(x => `<option value="${B.esc(x.key)}">#${x.pno} ${B.esc(x.name)} (${x.n}회)</option>`).join('') + '<option value="__new">＋ 새 프로젝트 만들기</option>';
    sel.value = [...sel.options].some(o => o.value === cur) ? cur : (mineP.length ? mineP[mineP.length - 1].key : '__new');
    $('#newproj').classList.toggle('hide', sel.value !== '__new');
  }
  function renderFilters() {
    const f = S.f[S.tab], el = $('#filters');
    if (S.tab === '진행현황') {
      const ps = projects();
      el.innerHTML = ps.length ? `<select class="input" id="pf" aria-label="프로젝트 선택"><option value="전체">전체 프로젝트</option>${ps.map(x => `<option value="${B.esc(x.key)}"${x.key === f ? ' selected' : ''}>${B.esc(nameOf(x.by))} · #${x.pno} ${B.esc(x.name)} (${x.n})</option>`).join('')}</select>` : '';
    } else {
      const list = S.tab === '질문' ? CATS : TYPES;
      el.innerHTML = ['전체'].concat(list).map(x => `<button type="button" class="fb" data-f="${B.esc(x)}" aria-pressed="${x === f}">${B.esc(x)}</button>`).join('');
    }
  }
  function postBody(p) {
    const link = p.link ? `<a class="plink" href="${B.esc(p.link)}" target="_blank" rel="noopener nofollow">🔗 ${B.esc(p.link.replace(/^https?:\/\//, '').slice(0, 60))}</a>` : '';
    if (p.kind === '진행현황' && p.project) {
      const sec = (t, v) => v ? `<div class="lg"><b>${t}</b><p>${linkify(v)}</p></div>` : '';
      return sec('오늘 시도한 것', p.tried) + sec('결과물', p.result) + sec('깨달은 것', p.learned) + link;
    }
    return (p.title ? `<h3 class="ptitle">${B.esc(p.title)}</h3>` : '') + `<p class="pt">${linkify(p.text)}</p>` + link;
  }
  function renderFeed(force) {
    const sig = JSON.stringify([S.tab, S.f, S.me && S.me.color, Object.values(S.members).map(m => m.color), S.posts.map(p => p.id + (p.pending ? '*' : '')), S.comments.map(c => c.id + (c.pending ? '*' : ''))]);
    if (!force && sig === S.sig) return; S.sig = sig;
    renderTabs(); renderProj(); renderFilters(); renderColor();
    const f = S.f[S.tab];
    let list = S.posts.filter(p => (p.kind || '정보 공유') === S.tab);
    if (S.tab === '정보 공유' && f !== '전체') list = list.filter(p => (p.cat || '기타') === f);
    if (S.tab === '질문' && f !== '전체') list = list.filter(p => (p.cat || '기타') === f);
    if (S.tab === '진행현황' && f !== '전체') list = list.filter(p => pkey(p) === f).sort((a, b) => a.at.localeCompare(b.at)); // 프로젝트 하나를 보면 일지 순서대로
    const order = {}; logs().slice().sort((a, b) => a.at.localeCompare(b.at)).forEach(p => { const k = pkey(p); order[p.id] = (order[k] = (order[k] || 0) + 1); });
    const drafts = {}; document.querySelectorAll('.cform input').forEach(i => { if (i.value) drafts[i.dataset.p] = i.value; });
    const ae = document.activeElement, focus = ae && ae.matches && ae.matches('.cform input') ? { p: ae.dataset.p, pos: ae.selectionStart } : null;
    const q = S.tab === '질문';
    $('#feed').innerHTML = list.length ? list.map(p => {
      const cs = S.comments.filter(c => c.postId === p.id);
      const chip = p.kind === '진행현황' && p.project ? `<span class="chip kind pn">#${p.pno} ${B.esc(p.project)} · ${order[p.id]}번째</span>` : (p.cat ? `<span class="chip kind">${B.esc(p.cat)}</span>` : '');
      return `<article class="card post m${p.pending ? ' pend' : ''}" style="${colorOf(p.by)}" data-id="${B.esc(p.id)}">
        <div class="ph">${avatar(p.by)}<div><div class="who">${B.esc(nameOf(p.by))}${isOp(p.by) ? ' <span class="chip">운영</span>' : ''}</div><div class="when">${p.pending ? '올리는 중…' : ago(p.at)}${!p.pending && mine(p.by) ? `<button class="del" data-delpost="${B.esc(p.id)}">삭제</button>` : ''}</div></div>${chip}</div>
        ${postBody(p)}
        <div class="cm">${q && cs.length ? `<div class="when" style="margin-bottom:4px">답변 ${cs.length}개</div>` : ''}${cs.map(c => `<div class="c${c.pending ? ' pend' : ''}"><span class="cw" style="${colorOf(c.by)};color:var(--c)">${B.esc(nameOf(c.by))}${isOp(c.by) ? ' ✓' : ''}</span><span class="ct">${linkify(c.text)}</span><span class="cwhen">${c.pending ? '올리는 중…' : ago(c.at)}</span>${!c.pending && mine(c.by) ? `<button class="del" data-delc="${B.esc(c.id)}">삭제</button>` : ''}</div>`).join('')}
          <form class="cform" data-p="${B.esc(p.id)}"><input class="input" data-p="${B.esc(p.id)}" maxlength="600" placeholder="${p.pending ? '올리는 중…' : q ? '답변 달기' : '댓글 달기'}" ${p.pending ? 'disabled' : ''} value="${B.esc(drafts[p.id] || '')}" aria-label="댓글"><button class="btn btn-ghost btn-sm" type="submit" ${p.pending ? 'disabled' : ''}>등록</button></form>
        </div></article>`;
    }).join('') : `<div class="empty">${f !== '전체' ? '이 분류에는 아직 글이 없어요.' : S.tab === '질문' ? '아직 질문이 없어요.<br>궁금한 건 뭐든 올려 보세요.' : S.tab === '진행현황' ? '아직 진행 기록이 없어요.<br>첫 프로젝트를 만들어 오늘 한 걸 남겨 보세요.' : '아직 올라온 자료가 없어요.<br>쓸 만한 링크나 프롬프트를 올려 보세요.'}</div>`;
    if (focus) { const el = document.querySelector(`.cform input[data-p="${CSS.escape(focus.p)}"]`); if (el) { el.focus(); try { el.setSelectionRange(focus.pos, focus.pos); } catch (e) {} } }
  }
  $('#tabs').addEventListener('click', e => { const t = e.target.closest('[data-tab]'); if (!t) return; S.tab = t.dataset.tab; B.store.set('tab', S.tab); renderFeed(true); });
  $('#filters').addEventListener('click', e => { const t = e.target.closest('[data-f]'); if (!t) return; S.f[S.tab] = t.dataset.f; renderFeed(true); });
  $('#filters').addEventListener('change', e => { if (e.target.id === 'pf') { S.f['진행현황'] = e.target.value; renderFeed(true); } });
  $('#proj').addEventListener('change', e => $('#newproj').classList.toggle('hide', e.target.value !== '__new'));
  pills($('#typepills'), TYPES, S.type, 'type'); pills($('#catpills'), CATS, S.cat, 'cat');

  /* ---------- 올리기 · 댓글 · 삭제 (화면에 먼저 반영) ---------- */
  $('#compose').addEventListener('submit', async e => {
    e.preventDefault(); const f = e.target, kind = S.tab, post = { kind }, v = n => (f[n].value || '').trim();
    if (f.link.value.trim()) post.link = v('link');
    if (kind === '정보 공유') { post.cat = f.type.value; post.title = v('title'); post.text = v('text'); if (!post.text && !post.link) return B.toast('코멘트나 링크를 적어 주세요', 'err'); post.text = post.text || post.title || post.link; }
    else if (kind === '질문') { post.cat = f.cat.value; post.title = v('qtitle'); post.text = v('qtext'); if (!post.title) return B.toast('질문 제목을 적어 주세요', 'err'); if (!post.text) return B.toast('질문 내용을 적어 주세요', 'err'); }
    else {
      const sel = f.proj.value; post.tried = v('tried'); post.result = v('result'); post.learned = v('learned');
      if (sel === '__new') { post.project = v('newproj'); if (!post.project) return B.toast('프로젝트 이름을 적어 주세요', 'err'); const ex = projects().find(x => x.by === S.me.id && x.name === post.project); if (ex) post.pno = ex.pno; else post.pno = projects().filter(x => x.by === S.me.id).reduce((m, x) => Math.max(m, x.pno), 0) + 1; }
      else { const ex = projects().find(x => x.key === sel); post.project = ex.name; post.pno = ex.pno; }
      if (!post.tried && !post.result && !post.learned) return B.toast('시도한 것·결과물·깨달은 것 중 하나는 적어 주세요', 'err');
      post.text = post.tried || post.result || post.learned;
    }
    const tmp = Object.assign({ id: 'tmp-' + Date.now(), by: S.me.id, at: new Date().toISOString(), pending: true }, post);
    const keep = {}; ['title', 'text', 'link', 'tried', 'result', 'learned', 'newproj', 'qtitle', 'qtext'].forEach(n => { keep[n] = f[n].value; f[n].value = ''; });
    S.posts.unshift(tmp); S.f[kind] = '전체'; renderFeed(true); S.busy++;
    try {
      const r = await B.api('addPost', { code: S.code, cid: tmp.id, post });
      if (!r.ok) throw new Error(r.error || '올리지 못했어요');
      S.posts = S.posts.filter(p => p !== tmp && p.id !== r.post.id); S.posts.unshift(r.post); S.posts.sort((a, b) => b.at.localeCompare(a.at));
      saveCache(); renderFeed(true);
    } catch (err) {
      S.posts = S.posts.filter(p => p !== tmp); renderFeed(true); Object.keys(keep).forEach(n => f[n].value = keep[n]); B.toast('올리지 못했어요: ' + err.message, 'err');
    } finally { S.busy--; }
  });
  $('#feed').addEventListener('submit', async e => {
    const f = e.target.closest('.cform'); if (!f) return; e.preventDefault();
    const inp = f.querySelector('input'), text = inp.value.trim(), postId = f.dataset.p; if (!text) return;
    const tmp = { id: 'tmp-' + Date.now(), postId, by: S.me.id, text, at: new Date().toISOString(), pending: true };
    S.comments.push(tmp); inp.value = ''; renderFeed(true); S.busy++;
    try {
      const r = await B.api('addComment', { code: S.code, cid: tmp.id, postId, text });
      if (!r.ok) throw new Error(r.error || '등록하지 못했어요');
      S.comments = S.comments.filter(c => c !== tmp && c.id !== r.comment.id); S.comments.push(r.comment); S.comments.sort((a, b) => a.at.localeCompare(b.at));
      saveCache(); renderFeed(true);
    } catch (err) {
      S.comments = S.comments.filter(c => c !== tmp); renderFeed(true); const el = document.querySelector(`.cform input[data-p="${CSS.escape(postId)}"]`); if (el) el.value = text; B.toast('등록하지 못했어요: ' + err.message, 'err');
    } finally { S.busy--; }
  });
  $('#feed').addEventListener('click', async e => {
    const dp = e.target.closest('[data-delpost]'), dc = e.target.closest('[data-delc]');
    if (!dp && !dc) return; if (!confirm(dp ? '이 글을 삭제할까요? (댓글도 함께 지워져요)' : '이 댓글을 삭제할까요?')) return;
    const id = (dp || dc).dataset[dp ? 'delpost' : 'delc'];
    if (dp) { S.posts = S.posts.filter(p => p.id !== id); S.comments = S.comments.filter(c => c.postId !== id); } else S.comments = S.comments.filter(c => c.id !== id);
    saveCache(); renderFeed(true); S.busy++;
    try { const r = await B.api(dp ? 'deletePost' : 'deleteComment', { code: S.code, id }); if (!r.ok) throw new Error(r.error || '삭제하지 못했어요'); }
    catch (err) { B.toast(err.message, 'err'); await sync(); } finally { S.busy--; }
  });
  $('#refresh').onclick = async () => { const ok = await sync(); B.toast(ok ? '새로 불러왔어요' : '연결이 느려요. 잠시 후 다시 눌러 주세요', ok ? '' : 'err'); };

  // 자동 새로고침: 화면이 보일 때, 올리는 중이거나 입력 중이 아닐 때만 (30초 / 탭으로 돌아왔을 때)
  const idle = () => { const ae = document.activeElement; return !S.busy && !(ae && ['INPUT', 'TEXTAREA'].includes(ae.tagName) && ae.value) && !['text', 'qtext', 'tried', 'result', 'learned'].some(n => $('#compose')[n].value); };
  setInterval(() => { if (!document.hidden && S.me && idle()) sync(); }, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && S.me && idle() && Date.now() - S.last > 15000) sync(); });

  boot();
})();
</script>
</body>
</html>
